name: Interface contracts
on:
  push:
    paths: ['interface_contracts_specification.md', 'scripts/check_contract_examples.py', '.github/workflows/contracts.yml']
  pull_request:
    paths: ['interface_contracts_specification.md', 'scripts/check_contract_examples.py', '.github/workflows/contracts.yml']
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check_contract_examples.py
      - run: git diff --check
