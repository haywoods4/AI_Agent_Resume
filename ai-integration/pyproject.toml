[project]
name = "resume-ai-integration"
version = "0.1.0"
description = "FastAPI integration for privacy-filtered resume evidence, Hermes/Groq, OPA and SQLite"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1",
  "python-multipart==0.0.20", "pypdf==5.5.0", "python-docx==1.1.2", "python-dotenv==1.1.0",
  "redis==5.2.1"
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.11.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
